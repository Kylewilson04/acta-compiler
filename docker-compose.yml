services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: acta-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-acta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-acta_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-acta}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - acta_pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-acta} -d $${POSTGRES_DB:-acta}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  acta_pgdata:
    driver: local
